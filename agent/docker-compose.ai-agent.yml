version: '3.8'

services:
  # 1. Engine Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2 # Mengizinkan 2 model stanby bersamaan di RAM
      - OLLAMA_NUM_PARALLEL=2      # Mengizinkan 2 request diproses secara simultan
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # 2. Open-WebUI
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

  # 3. 9Router dengan INITIAL_PASSWORD
  router:
    image: decolua/9router:latest
    container_name: 9router
    ports:
      - "20128:20128"
    volumes:
      - ~/.9router:/root/.9router
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - PORT=20128
      - INITIAL_PASSWORD=${INITIAL_PASSWORD}
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  open-webui_data: