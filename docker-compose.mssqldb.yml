services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql-service  # Nama untuk kontainer MSSQL
    restart: always
    environment:
      SA_PASSWORD: ${SA_PASSWORD}  # Ganti dengan password yang kuat
      ACCEPT_EULA: "Y"  # Setuju dengan lisensi
    ports:
      - "${BIND_IP:-127.0.0.1}:1433:1433"  # Memetakan port MSSQL ke port host
    volumes:
      - mssql_data:/var/opt/mssql 
    mem_limit: ${LIMIT_RAM}g
    cpus: ${LIMIT_CPU}
    networks:
      - general-net

volumes:
  mssql_data:

networks:
  general-net:
    name: general-net
    driver: bridge
