services:
  db:
    build: .
    container_name: mysql-service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${BIND_IP:-127.0.0.1}:${MYSQL_PORT}:3306"
    volumes:
      - ${MYSQL_DATA_PATH}
    mem_limit: ${LIMIT_RAM}g
    cpus: ${LIMIT_CPU}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - general-net

volumes:
  mysql_data: # referenced by MYSQL_DATA_PATH (mysql_data:/var/lib/mysql)

networks:
  general-net:
    name: general-net
    driver: bridge
