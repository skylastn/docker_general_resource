services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
    volumes:
      - mongo_data:/data/db
    networks:
      - mongo-net
      - general-net

volumes:
  mongo_data:

networks:
  mongo-net:
    name: mongo-net
  general-net:
    name: general-net
    driver: bridge