services:
  redis:
    image: redis:latest
    container_name: redis-service
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${REDIS_PORT}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD} # used by the healthcheck below
    mem_limit: "${LIMIT_RAM}g"
    cpus: "${LIMIT_CPU}"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --save 60 1000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - general-net

volumes:
  redis-data:

networks:
  general-net:
    name: general-net
    driver: bridge