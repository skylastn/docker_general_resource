services:
  java-app:
    container_name: tomcat-service
    restart: always  # Selalu restart jika service down
    build:
      context: D:\Kerja\Me\Demo\demo  # Path ke subdirektori yang berisi Dockerfile
    ports:
      - "${BIND_IP:-127.0.0.1}:7000:7000"
    networks:
      - general-net

networks:
  general-net:
    name: general-net
    driver: bridge