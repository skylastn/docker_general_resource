services:
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-service # Menetapkan nama container untuk phpmyadmin
    restart: always
    volumes:
      - ./php.ini:/usr/local/etc/php/conf.d/zzz-overrides.ini
      - ./themes/blueberry/blueberry:/var/www/html/themes/pmahomme
    ports:
      - "${BIND_IP:-127.0.0.1}:8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    mem_limit: ${LIMIT_RAM}g
    cpus: ${LIMIT_CPU}
    networks:
      - general-net

networks:
  general-net:
    name: general-net
    driver: bridge
